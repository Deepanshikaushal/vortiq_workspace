name: VortiQ Workspace CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Backend Build, Test & JaCoCo Code Coverage
  backend-ci:
    name: Backend CI (Spring Boot & JUnit 5)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Compile and Run Unit Tests with JaCoCo
      working-directory: ./backend
      run: mvn clean test -B

    - name: Package Production Executable JAR
      working-directory: ./backend
      run: mvn package -DskipTests=false -B

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: backend/target/surefire-reports/

    - name: Upload JaCoCo Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage
        path: backend/target/site/jacoco/

  # 2. Frontend Build & Static Asset Validation
  frontend-ci:
    name: Frontend CI (React 18 & Vite)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci || npm install

    - name: Build Vite Production Bundle
      working-directory: ./frontend
      run: npm run build

  # 3. Docker Compose Orchestration Lint
  docker-validation:
    name: Container Orchestration Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Validate Docker Compose Configuration
      run: docker compose config
