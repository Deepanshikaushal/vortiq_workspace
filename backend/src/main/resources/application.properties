# Server Port Configuration (Supports PORT env var for Render/Cloud Run)
server.port=${PORT:8080}

# Database Datasource Configuration (PostgreSQL / H2 fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:h2:mem:vortiqdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${JDBC_DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${JDBC_DATABASE_PASSWORD:}}

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Enable H2 Console (for local testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator Health Check Configuration for Render / Cloud Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Allowed Origins for CORS (Configurable via ALLOWED_ORIGINS env var, defaults to *)
cors.allowed-origins=${ALLOWED_ORIGINS:*}

# JWT Authentication Configuration
jwt.secret=${JWT_SECRET:9a8f7e6d5c4b3a210987654321fedcba0987654321fedcba0987654321fedcba}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

