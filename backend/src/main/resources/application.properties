# Server Port Configuration (Supports PORT env var for Render/Cloud Run)
server.port=${PORT:8080}

# H2 Database configuration with Env Overrides
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:vortiqdb}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator Health Check Configuration for Render / Cloud Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Allowed Origins for CORS (Configurable via ALLOWED_ORIGINS env var, defaults to *)
cors.allowed-origins=${ALLOWED_ORIGINS:*}

# JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

